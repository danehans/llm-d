endpoint:
  stack_name: &stack_name inf-scheduling-4gpu-Qwen3-32B  # user defined name for the stack (results prefix)
  model: &model Qwen/Qwen3-32B        # Exact HuggingFace model name. Must match stack deployed.
  namespace: &namespace ${NAMESPACE}  # Namespace where stack is deployed
  base_url: &url http://${GATEWAY_SVC}.${NAMESPACE}.svc.cluster.local:80  # Base URL of inference endpoint
  hf_token_secret: llm-d-hf-token     # The name of secret that contains the HF token of the stack

control:
  work_dir: $HOME/llm-d-bench-work  # working directory to store temporary and autogenerated files.
                                    # Do not edit content manually.
                                    # If not set, a temp directory will be created.
  kubectl: kubectl                  # kubectl command: kubectl or oc

harness:
  name: &harness_name inference-perf
  results_pvc: ${BENCHMARK_PVC}   # PVC where benchmark results are stored
  namespace: *namespace           # Namespace where harness is deployed. Typically with stack.
  parallelism: 1                  # Number of parallel workload launcher pods to create.
  wait_timeout: 6000              # Time (in seconds) to wait for workload launcher pod to complete before terminating.
                                  # Set to 0 to disable timeout.
  image: ghcr.io/llm-d/llm-d-benchmark:v0.5.2
  # dataset_url: &dataset_url none

env:
  - name: RAYON_NUM_THREADS
    value: "4"

workload:                         # yaml configuration for harness workload(s)

  # 4-GPU variant of the guide workload. Keeps the same shared-prefix-heavy shape as guide.yaml,
  # but reduces rates to approximately 25% of the 16-GPU profile for a 2-replica TP=2 deployment.
  # This profile also assumes a reduced vLLM max model length of 8192, so the input side is trimmed
  # enough to leave headroom for tokenizer/template overhead plus the requested 1000-token completion.
  Shared_prefix:
    load:
      type: poisson
      stages:
        # Warmup
        - rate: 4
          duration: 50

        # Main ladder
        - rate: 1
          duration: 20
        - rate: 3
          duration: 20
        - rate: 4
          duration: 20
        - rate: 5
          duration: 38
        - rate: 6
          duration: 34
        - rate: 7
          duration: 30
        - rate: 8
          duration: 25
        - rate: 9
          duration: 21
        - rate: 10
          duration: 38
        - rate: 11
          duration: 36
        - rate: 12
          duration: 33
        - rate: 13
          duration: 29
        - rate: 14
          duration: 27
        - rate: 15
          duration: 25
    api:
      type: completion
      streaming: true
    server:
      type: vllm
      model_name: *model
      base_url: *url
      ignore_eos: true
    tokenizer:
      pretrained_model_name_or_path: *model
    data:
      type: shared_prefix
      shared_prefix:
        num_groups: 150                 # Number of distinct prefix, Note: the number of users is num_groups * num_prompts_per_group
        num_prompts_per_group: 5        # Number of unique questions per group (prefix)
        system_prompt_len: 6000         # Length of the first prefix (in tokens), simulate initialization of a system prompt
        question_len: 700               # Trimmed from 1200 to leave a safer buffer on 8192-context deployments
        # question_len_std=9
        output_len: 1000                # Target length for the model's generated output (in tokens)
        # output_len_std=300
        enable_multi_turn_chat: false   # If enabled, the chat context will be appended for the each request.
    report:
      request_lifecycle:
        summary: true
        per_stage: true
        per_request: true
    storage:
      local_storage:
        path: /workspace
